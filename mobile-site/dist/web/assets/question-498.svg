<g font-family="Consolas,monospace" font-size="14" fill="#d6e8dd"><text x="43" y="72">radius-server template Huawei</text><text x="43" y="104">radius-server shared-key cipher Huawei</text><text x="43" y="136">radius-server authentication 200.0.12.1 1812</text><text x="43" y="168">radius-server accounting 200.0.12.1 1813</text></g>
